name: PR Complexity Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: Analyze PR complexity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python analyzer dependency
        run: pip install radon==6.*

      - name: Build pr-complexity
        run: go build -o pr-complexity .

      - name: Run complexity analysis
        id: complexity
        shell: bash
        run: |
          set +e
          ./pr-complexity analyze \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD" \
            --format markdown \
            --threshold 5 \
            > pr-complexity-report.md
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-complexity-report -->';
            const report = fs.readFileSync('pr-complexity-report.md', 'utf8');
            const body = `${marker}\n${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce threshold
        if: steps.complexity.outputs.exit_code != '0'
        run: exit "${{ steps.complexity.outputs.exit_code }}"